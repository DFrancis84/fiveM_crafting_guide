<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crafting Console</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <header class="header">
      <h1>🛠 Crafting Console</h1>
      <p>Plan crafts, materials, XP, and cost</p>
    </header>

    <section class="panel">
      <h2>🎯 Craft Selector</h2>

      <div class="controls">
        <select id="categorySelect">
          <option value="">Select Category</option>
        </select>

        <select id="itemSelect" disabled>
          <option value="">Select Item</option>
        </select>

        <input id="quantity" type="number" value="1" min="1" />

        <input id="ownedRecyclables" type="number" min="0" placeholder="Recyclables owned" />

        <div id="craftableCount">Can craft: 0</div>

        <button id="addQueueBtn">➕ Add Item</button>
        <button id="openEditorBtn">⚙️ Admin Panel</button>
      </div>

      <div class="selector-options">
        <label class="xp-toggle">
          <span>Include Component XP</span>
          <span class="switch">
            <input id="includeComponentXP" type="checkbox" checked>
            <span class="slider"></span>
          </span>
        </label>

        <div class="xp-boost-toggle">
          <span>Fixer XP Boost</span>

          <div class="boost-options">
            <input type="radio" id="boost0" name="fixerBoost" value="0" checked>
            <label for="boost0">None</label>

            <input type="radio" id="boost1" name="fixerBoost" value="1">
            <label for="boost1">+1</label>

            <input type="radio" id="boost2" name="fixerBoost" value="2">
            <label for="boost2">+2</label>

            <input type="radio" id="boost3" name="fixerBoost" value="3">
            <label for="boost3">+3</label>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>🧾 Crafting Queue</h2>
      <div id="craftQueue" class="queue-list">
        <div class="muted">No items added yet.</div>
      </div>
    </section>

    <div class="view-toggle">
      <button id="singleViewBtn">Selected Item</button>
      <button id="queueViewBtn">Craft Queue</button>
    </div>

    <section class="output-grid">
      <div class="panel">
        <div class="summary-box">
          <div id="stopLevel">🎯 Stop Level: 0</div>
          <div id="xpTotal">⭐ XP Gained: 0</div>
          <div id="recyclableTotal">♻️ Recyclable Materials Needed: 0</div>
          <div id="costTotal">💰 Cost To Make: 0</div>
        </div>

        <div class="section-divider"></div>

        <h2>🧩 Components Required</h2>
        <div id="components"></div>
      </div>

      <div class="panel">
        <div class="materials-header">
          <h2>📦 Total Materials</h2>

          <label class="mini-toggle">
            <span>Use Owned</span>
            <span class="switch">
              <input id="useOwnedMaterials" type="checkbox">
              <span class="slider"></span>
            </span>
          </label>
        </div>

        <div id="materials"></div>
      </div>
    </section>
  </main>

  <div id="adminAuthModal" class="modal-backdrop">
    <div class="modal small-modal">
      <h3>🔐 Admin Authentication</h3>

      <label>Authenticator Code</label>
      <input id="adminAuthCode" maxlength="6" inputmode="numeric" placeholder="6-digit code" />

      <div class="modal-actions">
        <button id="submitAdminAuthBtn">Unlock Admin</button>
        <button class="danger-btn" id="closeAdminAuthBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
