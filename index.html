<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crafting Console</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <header class="header">
      <h1>🛠 Crafting Console</h1>
      <p>Plan crafts, calculate materials, XP, recyclables, and cost.</p>
    </header>

    <section class="panel">
      <h2>🎯 Craft Selector</h2>

      <div class="controls">
        <select id="itemSelect"></select>
        <input id="quantity" type="number" value="1" min="1" />
        <button id="addQueueBtn" type="button">➕ Add Item</button>
        <button id="openEditorBtn" type="button">⚙️ Add / Update</button>
      </div>
    </section>

    <section class="panel">
      <h2>🧾 Crafting Queue</h2>
      <div id="craftQueue" class="queue-list">
        <div class="muted">No items added yet.</div>
      </div>
    </section>

    <div class="view-toggle">
      <button id="singleViewBtn" type="button">Selected Item</button>
      <button id="queueViewBtn" type="button">Craft Queue</button>
    </div>

    <section class="output-grid">
      <div class="panel">
        <h2>🧩 Components Required</h2>
        <div id="components"></div>
      </div>

      <div class="panel">
        <h2>📦 Total Materials</h2>
        <div id="materials"></div>

        <div class="summary-box">
          <div id="xpTotal">⭐ XP Gained: 0</div>
          <div id="recyclableTotal">♻️ Recyclable Materials Needed: 0</div>
          <div id="costTotal">💰 Cost To Make: 0</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Admin Modal -->
  <div id="popup" class="modal-backdrop">
    <div class="modal">
      <h3>🛠 Crafting Editor</h3>

      <label>Edit Existing Item</label>
      <select id="editItemSelect">
        <option value="">New Item</option>
      </select>

      <label>Item Name</label>
      <input id="newItem" placeholder="Item Name" />

      <label>XP Per Craft</label>
      <input id="newXP" type="number" placeholder="XP" />

      <h4>🧩 Components</h4>
      <div id="componentsList"></div>
      <button type="button" class="secondary-btn" id="addComponentRowBtn">
        ➕ Add Component
      </button>

      <h4>📦 Materials</h4>
      <div id="materialsList"></div>
      <button type="button" class="secondary-btn" id="addMaterialRowBtn">
        ➕ Add Material
      </button>

      <label>Authenticator Code</label>
      <input id="authCode" maxlength="6" inputmode="numeric" placeholder="6-digit code" />

      <div class="modal-actions">
        <button type="button" id="submitEditorBtn">💾 Save Item</button>
        <button type="button" class="danger-btn" id="closeEditorBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
