<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crafting Console</title>

  <link rel="stylesheet" href="style.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <h1>🛠 Crafting Console</h1>

    <!-- MAIN CONTROLS -->
    <div class="controls">

      <select id="itemSelect"></select>

      <input
        id="quantity"
        type="number"
        value="1"
        min="1"
      >

      <button onclick="calculate()">Analyze</button>

      <!-- NEW: ADMIN BUTTON -->
      <button onclick="openAddItem()">➕ Add / Update Item</button>

    </div>

    <!-- COMPONENTS -->
    <div class="panel">
      <h2>🧩 Components Required</h2>
      <div id="components"></div>
    </div>

    <!-- MATERIALS -->
    <div class="panel">
      <h2>📦 Total Materials</h2>
      <div id="materials"></div>

      <!-- ♻️ RECYCLABLE TOTAL -->
      <div style="margin-top: 12px; font-weight: bold; color: #38bdf8;">
        <span id="recyclableTotal">
          ♻️ Recyclable Materials Needed: 0
        </span>
      </div>
    </div>

  </div>

  <!-- =========================
       POPUP: ADD / UPDATE FORM
  ========================== -->
  <div id="popup" style="display:none;">
    <div>

    <h3>Add / Update Item</h3>

    <!-- MODE -->
    <select id="mode">
      <option value="add">Add</option>
      <option value="update">Update</option>
    </select>

    <!-- FIELDS -->
    <input id="newItem" placeholder="Item">
    <input id="newType" placeholder="Type">
    <input id="newName" placeholder="Name">
    <input id="newQty" type="number" placeholder="Qty">

    <!-- 🔐 AUTH CODE FIELD -->
    <input id="authCode" placeholder="Authenticator Code (6-digit)">    
    
    <!-- FUNCTIONS -->
    <button onclick="submitItem()">Submit</button>
    <button onclick="closeAddItem()">Cancel</button>

  </div>
</div>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
