<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crafting Console</title>

  <link rel="stylesheet" href="style.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <h1>🛠 Crafting Console</h1>

    <!-- MAIN CONTROLS -->
    <div class="controls">

      <select id="itemSelect"></select>

      <input
        id="quantity"
        type="number"
        value="1"
        min="1"
      >

      <button onclick="calculate()">Analyze</button>

      <!-- NEW: ADMIN BUTTON -->
      <button onclick="openAddItem()">➕ Add / Update Item</button>

    </div>

    <!-- COMPONENTS -->
    <div class="panel">
      <h2>🧩 Components Required</h2>
      <div id="components"></div>
    </div>

    <!-- MATERIALS -->
    <div class="panel">
      <h2>📦 Total Materials</h2>
      <div id="materials"></div>

      <!-- ♻️ RECYCLABLE TOTAL -->
      <div style="margin-top: 12px; font-weight: bold; color: #38bdf8;">
        <span id="recyclableTotal">
          ♻️ Recyclable Materials Needed: 0
        </span>
      </div>
    </div>

  </div>

  <!-- =========================
       POPUP: ADD / UPDATE FORM
  ========================== -->
  <div id="popup" style="
    display:none;
    position:fixed;
    top:20%;
    left:50%;
    transform:translateX(-50%);
    background:#111827;
    padding:20px;
    border-radius:10px;
    width:300px;
    border:1px solid #334155;
  ">

    <h3 id="formTitle">Add / Update Item</h3>

    <!-- MODE -->
    <select id="mode" style="width:100%; margin-bottom:10px;">
      <option value="add">Add</option>
      <option value="update">Update</option>
    </select>

    <!-- FIELDS -->
    <input id="newItem" placeholder="Item (e.g. Tech9)" style="width:100%; margin-bottom:8px;">
    <input id="newType" placeholder="Type (component/material)" style="width:100%; margin-bottom:8px;">
    <input id="newName" placeholder="Name (e.g. Metal Spring)" style="width:100%; margin-bottom:8px;">
    <input id="newQty" type="number" placeholder="Qty" style="width:100%; margin-bottom:12px;">

    <!-- ACTIONS -->
    <button onclick="submitItem()" style="width:100%; margin-bottom:6px;">
      Submit
    </button>

    <button onclick="closeAddItem()" style="width:100%;">
      Cancel
    </button>

  </div>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
