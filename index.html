<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crafting Console</title>

  <link rel="stylesheet" href="style.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <h1>🛠 Crafting Console</h1>

    <!-- MAIN CONTROLS -->
    <div class="controls">

      <select id="itemSelect"></select>

      <input
        id="quantity"
        type="number"
        value="1"
        min="1"
      >

      <!-- NEW: ADMIN BUTTON -->
      <button onclick="openAddItem()">➕ Add / Update Item</button>

    </div>

    <!-- COMPONENTS -->
    <div class="panel">
      <h2>🧩 Components Required</h2>
      <div id="components"></div>
    </div>

    <!-- MATERIALS -->
    <div class="panel">
      <h2>📦 Total Materials</h2>
      <div id="materials"></div>

      <!-- ♻️ RECYCLABLE TOTAL -->
      <div style="margin-top: 12px; font-weight: bold; color: #38bdf8;">
        <span id="recyclableTotal">
          ♻️ Recyclable Materials Needed: 0
        </span>
      </div>
      <div style="margin-top: 10px; font-weight: bold; color: #22c55e;">
        <span id="xpTotal">
          ⭐ XP Gained: 0
        </span>
      </div>
    </div>

  </div>

  <!-- =========================
       POPUP: ADD / UPDATE FORM
  ========================== -->
<div id="popup" style="display:none;">
  <div class="modal">
    <h3>🛠 Crafting Editor</h3>

    <label>Edit Existing Item</label>
    <select id="editItemSelect">
      <option value="">New Item</option>
    </select>

    <label>Item Name</label>
    <input id="newItem" placeholder="Item Name">

    <label>XP Per Craft</label>
    <input id="newXP" type="number" placeholder="XP">

    <h4>🧩 Components</h4>
    <div id="componentsList"></div>
    <button type="button" onclick="addEditorRow('componentsList')">➕ Add Component</button>

    <h4>📦 Materials</h4>
    <div id="materialsList"></div>
    <button type="button" onclick="addEditorRow('materialsList')">➕ Add Material</button>

    <label>Authenticator Code</label>
    <input id="authCode" maxlength="6" inputmode="numeric" placeholder="6-digit code">

    <button type="button" onclick="submitItem()">💾 Save Item</button>
    <button type="button" onclick="closeAddItem()">Cancel</button>
  </div>
</div>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
