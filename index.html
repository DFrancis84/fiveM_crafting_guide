<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crafting Console</title>

  <link rel="stylesheet" href="style.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <h1>🛠 Crafting Console</h1>

    <!-- CONTROLS -->
    <div class="controls">
      <select id="itemSelect"></select>

      <input
        id="quantity"
        type="number"
        value="1"
        min="1"
      >

      <button onclick="calculate()">Analyze</button>
      <button onclick="openAddItem()">+ Add Item</button>
    </div>

    <!-- COMPONENTS PANEL -->
    <div class="panel">
      <h2>🧩 Components Required</h2>
      <div id="components"></div>
    </div>

    <!-- MATERIALS PANEL -->
    <div class="panel">
      <h2>📦 Total Materials</h2>
      <div id="materials"></div>

      <!-- ♻️ RECYCLABLE TOTAL (NEW FIELD) -->
      <div style="margin-top: 12px; font-weight: bold; color: #38bdf8;">
        <span id="recyclableTotal">
          ♻️ Recyclable Materials Needed: 0
        </span>
      </div>
    </div>

  </div>

  <!-- SCRIPT (must load AFTER DOM) -->
  <script src="script.js"></script>

  <!-- AddItem Popup -->
  <div id="popup" style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:#111827; padding:20px; border-radius:10px;">
  
  <h3 id="formTitle">Add / Update Crafting Entry</h3>
  <select id="mode">
    <option value="add">Add</option>
    <option value="update">Update</option>
  </select>
  <input id="newItem" placeholder="Item (e.g. Tech9)">
  <input id="newType" placeholder="Type (component/material)">
  <input id="newName" placeholder="Name (e.g. Metal Spring)">
  <input id="newQty" type="number" placeholder="Qty">

  <br><br>

  <button onclick="submitItem()">Submit</button>
  <button onclick="closeAddItem()">Cancel</button>
</div>
  
</body>
</html>
