<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crafting Console</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">

    <!-- HEADER -->
    <header class="header">
      <h1>🛠 Crafting Console</h1>
      <p>Plan crafts, materials, XP, and cost</p>
    </header>

    <!-- SELECT ITEM -->
    <section class="panel">
      <h2>🎯 Craft Selector</h2>

      <div class="controls">
        <select id="itemSelect"></select>

        <input id="quantity" type="number" value="1" min="1" />

        <button id="addQueueBtn">➕ Add Item</button>

        <button id="openEditorBtn">⚙️ Admin Panel</button>

        <!-- XP TOGGLE -->
        <label class="xp-toggle">
          <span>Include Component XP</span>

            <div class="switch">
              <input id="includeComponentXP" type="checkbox" checked>
              <span class="slider"></span>
            </div>
        </label>
      </div>
    </section>

    <!-- QUEUE -->
    <section class="panel">
      <h2>🧾 Crafting Queue</h2>
      <div id="craftQueue" class="queue-list">
        <div class="muted">No items added yet.</div>
      </div>
    </section>

    <!-- VIEW TOGGLE -->
    <div class="view-toggle">
      <button id="singleViewBtn">Selected Item</button>
      <button id="queueViewBtn">Craft Queue</button>
    </div>

    <!-- OUTPUT -->
    <section class="output-grid">

      <!-- COMPONENTS -->
      <div class="panel">
        <h2>🧩 Components Required</h2>
        <div id="components"></div>
      </div>

      <!-- MATERIALS -->
      <div class="panel">
        <h2>📦 Total Materials</h2>
        <div id="materials"></div>

        <div class="summary-box">
          <div id="xpTotal">⭐ XP Gained: 0</div>
          <div id="recyclableTotal">♻️ Recyclable Materials Needed: 0</div>
          <div id="costTotal">💰 Cost To Make: 0</div>
        </div>
      </div>

    </section>

  </main>

  <!-- ===============================
       🛠 ADMIN PANEL (MODAL)
  =============================== -->
  <div id="popup" class="modal-backdrop">
    <div class="modal">

      <h3>🛠 Crafting Editor</h3>

      <!-- EXISTING ITEM -->
      <label>Edit Existing Item</label>
      <select id="editItemSelect">
        <option value="">New Item</option>
      </select>

      <!-- ITEM NAME -->
      <label>Item Name</label>
      <input id="newItem" placeholder="Item Name" />

      <!-- XP -->
      <label>XP Per Craft</label>
      <input id="newXP" type="number" placeholder="XP" />

      <!-- COMPONENTS -->
      <h4>🧩 Components</h4>
      <div id="componentsList"></div>
      <button type="button" class="secondary-btn" id="addComponentRowBtn">
        ➕ Add Component
      </button>

      <!-- MATERIALS -->
      <h4>📦 Materials</h4>
      <div id="materialsList"></div>
      <button type="button" class="secondary-btn" id="addMaterialRowBtn">
        ➕ Add Material
      </button>

      <!-- AUTH -->
      <label>Authenticator Code</label>
      <input id="authCode" maxlength="6" placeholder="6-digit code" />

      <!-- ACTIONS -->
      <div class="modal-actions">
        <button id="submitEditorBtn">💾 Save Item</button>
        <button class="danger-btn" id="closeEditorBtn">Cancel</button>
      </div>

      <hr class="modal-divider">

      <!-- ===============================
           💰 COST EDITOR
      =============================== -->

      <h3>💰 Cost Editor</h3>

      <label>Material</label>
      <select id="costMaterialSelect"></select>

      <label>Cost Per</label>
      <input id="costPerInput" type="number" placeholder="Cost Per" />

      <button id="saveCostBtn" class="secondary-btn">
        💾 Save Cost
      </button>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
